name: revisar
# Corre en cada PR que agrega una publicación a la cola. Si algo falla, el PR queda en rojo.
on:
  pull_request:
    paths: ['queue/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-color-emoji
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Revisar publicaciones
        id: rev
        run: |
          DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- queue | cut -d/ -f1-2 | sort -u | while read d; do [ -d "$d" ] && echo "$d"; done)
          echo "Carpetas: $DIRS"
          set +e
          python scripts/revisar.py $DIRS --reporte reporte.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          {
            echo "# Revisión automática"
            echo
            cat reporte.md
            echo
            echo "### Vista previa"
            RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}"
            for d in $DIRS; do
              for f in $(ls $d | grep -E '^post_[0-9]+\.jpg$' | sort -V) $(ls $d | grep -x historia.jpg); do
                echo "<img src=\"$RAW/$d/$f\" width=\"260\">"
              done
              echo
              echo "<details><summary>Texto del post</summary>"
              echo
              echo '```'
              cat "$d/texto.txt"
              echo '```'
              echo "</details>"
            done
            echo
            echo "Si está todo bien, aprobá con **Merge**: la historia sale enseguida y el post a las 19:30."
          } > comentario.md
      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file comentario.md
      - name: Resultado
        if: steps.rev.outputs.code != '0'
        run: |
          echo "::error::La revisión encontró errores. No aprobar hasta corregirlos."
          exit 1
