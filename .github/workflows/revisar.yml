name: revisar
# Corre en cada PR que agrega una publicación a la cola. Si algo falla, el PR queda en rojo.
on:
  pull_request:
    paths: ['queue/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-color-emoji
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Revisar publicaciones
        id: rev
        run: |
          DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- queue | cut -d/ -f1-2 | sort -u | while read d; do [ -d "$d" ] && echo "$d"; done)
          echo "Carpetas: $DIRS"
          set +e
          python scripts/revisar.py $DIRS --reporte reporte.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          {
            echo "# Revisión automática"
            echo
            cat reporte.md
            echo
            echo "### Vista previa"
            RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}"
            for d in $DIRS; do
              if [ -f "$d/plan.json" ]; then
                echo
                echo "**Horarios:**"
                python -c "import json,sys; [print(f\"- {i['hora']} · {i['tipo']} · {i['id']}\") for i in json.load(open(sys.argv[1]))['items']]" "$d/plan.json"
                echo
              fi
              for f in $(ls $d | grep -E '\.jpg$' | sort -V); do
                echo "<img src=\"$RAW/$d/$f\" width=\"200\" title=\"$f\">"
              done
              echo
              for f in $(ls $d | grep -E '\.mp4$'); do
                echo "🎬 Reel: [$f](https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/$d/$f)"
              done
              for t in $(ls $d | grep -E '\.txt$'); do
                echo
                echo "<details><summary>Texto: $t</summary>"
                echo
                echo '```'
                cat "$d/$t"
                echo '```'
                echo "</details>"
              done
            done
            echo
            echo "Si está todo bien, aprobá con **Merge**: cada contenido sale solo a su hora."
          } > comentario.md
      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file comentario.md
      - name: Resultado
        if: steps.rev.outputs.code != '0'
        run: |
          echo "::error::La revisión encontró errores. No aprobar hasta corregirlos."
          exit 1
