name: publicar
# Publica lo aprobado (mergeado a main): cada post, historia o reel a su hora (plan.json, hora Argentina).
on:
  push:
    branches: [main]
    paths: ['queue/**']
  schedule:
    # Respaldo: lo principal es el vigía (scripts/vigia.sh), que se queda despierto y publica a horario.
    # Estas corridas solo vuelven a arrancar la cadena si alguna vez se corta.
    - cron: '17 13,16,19,22 * * *'
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulación (no publica nada)'
        type: boolean
        default: true
      verificar:
        description: 'Solo verificar la conexión con Instagram (no publica)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Traer el último estado
        # Si dos corridas quedan en fila, la segunda tiene que ver lo que ya publicó la primera.
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Publicar en Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          VERIFICAR: ${{ github.event_name == 'workflow_dispatch' && inputs.verificar && '1' || '0' }}
        run: python scripts/publicar.py
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "base-bot"
          git config user.email "base-bot@users.noreply.github.com"
          git add queue/*/estado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Estado de publicación" && (git push || (git pull --rebase origin main && git push)))
      - name: Vigía (publica cada pieza a su hora)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.verificar)) }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DRY_RUN: '0'
          VERIFICAR: '0'
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/vigia.sh
