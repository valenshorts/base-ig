name: voz
# Le pone la voz de Valentín (ElevenLabs) a los reels de la cola que no la tienen.
# Necesita el secreto ELEVENLABS_API_KEY (Settings → Secrets and variables → Actions). Sin él, no hace nada.
on:
  push:
    branches: [main]
    paths: ['queue/**/reel.mp4', 'queue/**/plan.json', 'queue/**/voz/**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo probar la clave: genera una frase de prueba en videos/voces/valentin/prueba_api.mp3'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: voz
  cancel-in-progress: false
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Prueba de la clave
        if: github.event_name == 'workflow_dispatch' && inputs.prueba
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p videos/voces/valentin
          python -c "import sys; sys.path.insert(0,'videos'); import locucion as l; print('modelo:', l.tts('Hola, soy Valentín de BASE Suplementos. Esto es una prueba de voz.', '', '', 'videos/voces/valentin/prueba_api.mp3'))"
          ls -la videos/voces/valentin/prueba_api.mp3
          git add videos/voces/valentin/prueba_api.mp3
      - name: Agregar voz
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/voz_dia.py
      - name: Guardar
        run: |
          git config user.name "base-bot"
          git config user.email "base-bot@users.noreply.github.com"
          git add queue/*/reel.mp4 2>/dev/null || true
          git add queue/*/voz.ok 2>/dev/null || true
          git add videos/voces/valentin/prueba_api.mp3 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Voz de Valentín en el reel" && (git push || (git pull --rebase origin main && git push)))
